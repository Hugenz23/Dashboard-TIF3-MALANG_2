<div class="space-y-4">
  <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex items-center justify-between">
    <div>
      <h1 class="text-lg font-bold">KPI WISA</h1>
      <p class="text-xs text-slate-400">File terpisah: <code>pages/kpi-wisa.html</code></p>
    </div>
    <button id="btn-refresh-kpi-wisa" type="button" class="px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-medium">
      Refresh Data
    </button>
  </div>

  <div id="kpi-wisa-content" class="bg-slate-900 border border-slate-800 rounded-xl p-5 text-sm text-slate-300">
    Menyiapkan data KPI WISA...
  </div>
</div>

<script>
  window.initKpiWisa = async function () {
    const box = document.getElementById("kpi-wisa-content");
    const btn = document.getElementById("btn-refresh-kpi-wisa");

    async function loadData() {
      const url = window.APP_CONFIG.gasUrl;
      if (!url || url.includes("GANTI_DENGAN_URL")) {
        box.innerHTML = 'Silakan isi <code>gasUrl</code> di <code>assets/js/config.js</code> untuk menarik data dari Apps Script.';
        return;
      }
      box.innerHTML = '<span class="text-slate-400">Mengambil data KPI WISA...</span>';
      try {
        const res = await fetch(`${url}?menu=kpi_wisa`);
        const data = await res.json();
        box.innerHTML = `<pre class="text-xs overflow-auto">${JSON.stringify(data, null, 2)}</pre>`;
      } catch (err) {
        box.innerHTML = `<span class="text-red-400">Gagal memuat data: ${err.message}</span>`;
      }
    }

    if (btn) btn.addEventListener("click", loadData);
    await loadData();
  };
</script>
